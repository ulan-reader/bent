
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary)}
.topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.logo-mark{width:26px;height:26px;background:#1B3A6B;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.role-badge{background:#E6F1FB;color:#185FA5;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
.filters{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary)}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s}
.filter-btn:hover{border-color:var(--color-border-secondary)}
.filter-btn.active{background:#1B3A6B;color:#fff;border-color:#1B3A6B}
.filter-sep{flex:1}
.stats-row{display:flex;gap:6px;padding:10px 20px}
.stat-pill{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 14px;display:flex;align-items:center;gap:8px;flex:1}
.stat-num{font-size:20px;font-weight:500}
.stat-lbl{font-size:11px;color:var(--color-text-secondary);line-height:1.3}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 20px 20px;min-height:400px}
.col{}
.col-header{display:flex;align-items:center;gap:8px;padding:8px 0 10px;margin-bottom:0}
.col-title{font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--color-text-secondary)}
.col-count{background:var(--color-background-secondary);color:var(--color-text-tertiary);font-size:11px;font-weight:500;padding:1px 7px;border-radius:10px}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:200px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;cursor:default;transition:border-color .15s}
.card:hover{border-color:var(--color-border-secondary)}
.card.urgent{border-left:2px solid #E24B4A}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-type{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.type-emp{color:#185FA5}
.type-ins{color:#3B6D11}
.card-date{font-size:11px;color:var(--color-text-tertiary);white-space:nowrap}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.4;margin-bottom:4px}
.card-dept{font-size:11px;color:var(--color-text-secondary);margin-bottom:8px}
.card-text{font-size:12px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:10px;border-top:0.5px solid var(--color-border-tertiary);padding-top:8px}
.card-actions{display:flex;gap:5px}
.act-btn{flex:1;padding:5px 0;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s;text-align:center}
.act-btn:hover{background:var(--color-background-primary);border-color:var(--color-border-secondary)}
.act-btn.take{background:#E6F1FB;border-color:#B5D4F4;color:#185FA5}
.act-btn.take:hover{background:#B5D4F4}
.act-btn.done{background:#EAF3DE;border-color:#C0DD97;color:#3B6D11}
.act-btn.done:hover{background:#C0DD97}
.act-btn.reject{background:#FCEBEB;border-color:#F7C1C1;color:#A32D2D}
.act-btn.reject:hover{background:#F7C1C1}
.urgency-row{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.urgency-icon{font-size:12px;color:#E24B4A}
.urgency-text{font-size:11px;color:#A32D2D;font-weight:500}
.empty-col{text-align:center;padding:32px 0;color:var(--color-text-tertiary);font-size:12px}
.empty-col i{font-size:28px;display:block;margin-bottom:8px;opacity:.4}
.col-new .col-title{color:#A32D2D}
.col-new .col-count{background:#FCEBEB;color:#A32D2D}
.col-work .col-title{color:#854F0B}
.col-work .col-count{background:#FAEEDA;color:#854F0B}
.col-done .col-title{color:#3B6D11}
.col-done .col-count{background:#EAF3DE;color:#3B6D11}
</style>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">БТ</div>
    Цифровой контроль БЕНТ
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:12px;color:var(--color-text-secondary)">Кузиев Д.Д.</span>
    <span class="role-badge">Президент</span>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
  <button class="filter-btn" onclick="setFilter('emp',this)">Сотрудники</button>
  <button class="filter-btn" onclick="setFilter('ins',this)">Нарушения ТБ</button>
  <div class="filter-sep"></div>
  <button class="filter-btn" onclick="setFilter('urgent',this)">⚠ Просрочено</button>
</div>

<div class="stats-row">
  <div class="stat-pill"><span class="stat-num" id="s-total">0</span><span class="stat-lbl">Всего<br>обращений</span></div>
  <div class="stat-pill"><span class="stat-num" id="s-new" style="color:#E24B4A">0</span><span class="stat-lbl">Ожидают<br>реакции</span></div>
  <div class="stat-pill"><span class="stat-num" id="s-work" style="color:#BA7517">0</span><span class="stat-lbl">В<br>работе</span></div>
  <div class="stat-pill"><span class="stat-num" id="s-done" style="color:#639922">0</span><span class="stat-lbl">Решено<br>сегодня</span></div>
  <div class="stat-pill"><span class="stat-num" id="s-urgent" style="color:#E24B4A">0</span><span class="stat-lbl">Просрочено<br>48ч+</span></div>
</div>

<div class="board">
  <div class="col col-new">
    <div class="col-header">
      <span class="col-title">НОВЫЕ</span>
      <span class="col-count" id="cnt-new">0</span>
    </div>
    <div class="col-body" id="col-new"></div>
  </div>
  <div class="col col-work">
    <div class="col-header">
      <span class="col-title">В РАБОТЕ</span>
      <span class="col-count" id="cnt-work">0</span>
    </div>
    <div class="col-body" id="col-work"></div>
  </div>
  <div class="col col-done">
    <div class="col-header">
      <span class="col-title">РЕШЕНО</span>
      <span class="col-count" id="cnt-done">0</span>
    </div>
    <div class="col-body" id="col-done"></div>
  </div>
</div>

<script>
const DATA = [
  {id:1,type:'emp',dept:'РМЦ (БЕНТ)',cat:'Условия труда',text:'В раздевалке нет горячей воды уже третью неделю. Рабочие вынуждены мыться холодной водой после смены.',date:'21 мая, 09:14',status:'new',urgent:true,hoursAgo:52},
  {id:2,type:'ins',dept:'Цех газоблока',cat:'Работа на высоте',text:'Монтажник работает на высоте 4м без страховочного пояса. Зафиксировано фото.',date:'21 мая, 08:42',status:'new',urgent:false,hoursAgo:3},
  {id:3,type:'emp',dept:'АБК',cat:'Бытовые вопросы',text:'Кофемашина на этаже сломана уже 2 недели. Никакой реакции от АХО.',date:'21 мая, 07:30',status:'new',urgent:false,hoursAgo:4},
  {id:4,type:'ins',dept:'Основное подразделение',cat:'СИЗ',text:'Три сотрудника на участке сварки без защитных очков. Неоднократные предупреждения игнорируются.',date:'20 мая, 15:30',status:'work',urgent:false,hoursAgo:18},
  {id:5,type:'emp',dept:'ШЦ',cat:'Предложение по улучшению',text:'Предлагаю организовать зону отдыха на участке с навесом — летом очень жарко.',date:'20 мая, 11:05',status:'work',urgent:true,hoursAgo:50},
  {id:6,type:'ins',dept:'РМЦ (Fasteners)',cat:'Электробезопасность',text:'Открытая распределительная коробка в зоне прохода. Риск поражения током.',date:'20 мая, 09:00',status:'work',urgent:false,hoursAgo:24},
  {id:7,type:'emp',dept:'Отдел сбыта',cat:'Условия труда',text:'Кондиционер в open-space не работает. Температура в офисе 32°C.',date:'19 мая, 16:00',status:'done',urgent:false,hoursAgo:72},
  {id:8,type:'ins',dept:'Цех газоблока',cat:'Пожарная безопасность',text:'Огнетушитель в секции №3 просрочен на 4 месяца. Требует немедленной замены.',date:'19 мая, 14:00',status:'done',urgent:false,hoursAgo:68},
  {id:9,type:'emp',dept:'БСЦ',cat:'Бытовые вопросы',text:'Столовая закрывается в 12:30, вторая смена не успевает пообедать.',date:'18 мая, 10:22',status:'done',urgent:false,hoursAgo:90},
];

let currentFilter = 'all';

function typeLabel(t){return t==='emp'?'<i class="ti ti-user" aria-hidden="true"></i> Сотрудник':'<i class="ti ti-shield-check" aria-hidden="true"></i> Инспектор ТБ';}
function typeClass(t){return t==='emp'?'type-emp':'type-ins';}

function renderCard(item){
  const div = document.createElement('div');
  div.className = 'card' + (item.urgent && item.status!=='done'?' urgent':'');
  div.dataset.id = item.id;
  let urgRow = item.urgent && item.status!=='done'?`<div class="urgency-row"><i class="ti ti-alert-triangle urgency-icon" aria-hidden="true"></i><span class="urgency-text">Просрочено ${item.hoursAgo}ч</span></div>`:'';
  let actions = '';
  if(item.status==='new'){
    actions=`<div class="card-actions"><button class="act-btn take" onclick="moveCard(${item.id},'work')"><i class="ti ti-player-play" aria-hidden="true"></i> В работу</button><button class="act-btn reject" onclick="moveCard(${item.id},'done')"><i class="ti ti-x" aria-hidden="true"></i> Закрыть</button></div>`;
  } else if(item.status==='work'){
    actions=`<div class="card-actions"><button class="act-btn done" onclick="moveCard(${item.id},'done')"><i class="ti ti-check" aria-hidden="true"></i> Решено</button><button class="act-btn reject" onclick="moveCard(${item.id},'done')"><i class="ti ti-x" aria-hidden="true"></i> Отклонить</button></div>`;
  } else {
    actions=`<div class="card-actions" style="opacity:.5"><span class="act-btn" style="cursor:default"><i class="ti ti-circle-check" aria-hidden="true"></i> Закрыто</span></div>`;
  }
  div.innerHTML=`
    <div class="card-top">
      <div class="card-type ${typeClass(item.type)}">${typeLabel(item.type)}</div>
      <div class="card-date">${item.date}</div>
    </div>
    ${urgRow}
    <div class="card-title">${item.cat}</div>
    <div class="card-dept"><i class="ti ti-building" aria-hidden="true" style="font-size:11px;vertical-align:-1px"></i> ${item.dept}</div>
    <div class="card-text">${item.text}</div>
    ${actions}
  `;
  return div;
}

function moveCard(id, newStatus){
  const item = DATA.find(d=>d.id===id);
  if(!item) return;
  item.status = newStatus;
  item.urgent = false;
  render();
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  let filtered = DATA;
  if(currentFilter==='emp') filtered = DATA.filter(d=>d.type==='emp');
  else if(currentFilter==='ins') filtered = DATA.filter(d=>d.type==='ins');
  else if(currentFilter==='urgent') filtered = DATA.filter(d=>d.urgent && d.status!=='done');

  const cols = {new:[],work:[],done:[]};
  filtered.forEach(d=>cols[d.status].push(d));

  ['new','work','done'].forEach(s=>{
    const el = document.getElementById('col-'+s);
    el.innerHTML='';
    if(cols[s].length===0){
      el.innerHTML=`<div class="empty-col"><i class="ti ti-inbox" aria-hidden="true"></i>Нет обращений</div>`;
    } else {
      cols[s].forEach(item=>el.appendChild(renderCard(item)));
    }
    document.getElementById('cnt-'+s).textContent = cols[s].length;
  });

  document.getElementById('s-total').textContent = filtered.length;
  document.getElementById('s-new').textContent = cols.new.length;
  document.getElementById('s-work').textContent = cols.work.length;
  document.getElementById('s-done').textContent = DATA.filter(d=>d.status==='done').length;
  document.getElementById('s-urgent').textContent = DATA.filter(d=>d.urgent && d.status!=='done').length;
}

render();
</script>
